databases:
  - name: canada-grants-db
    plan: free
    databaseName: canada_grants
    ipAllowList: []

services:
  - type: web
    name: canada-grants-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    branch: Kirill-Riipen-Apr2026
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: canada-grants-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.6
